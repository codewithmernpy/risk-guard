[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskguard"
authors = [{ name = "Surani Asim" }]
version = "0.1.0"
description = "RiskGuard — Your crypto perpetuals risk desk and discipline coach."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "plotly>=5.20.0",
    "streamlit>=1.50.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "anthropic>=0.40.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
riskguard = "riskguard.cli:main"

[tool.setuptools.packages.find]
include = ["riskguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
